name: Package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-08
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-09-08
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install '.[test]'
      - name: Unit and interface tests
        run: python -m pytest
      - name: Installed synthetic example outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          qc-transfer-gap init --output qc-example
          qc-transfer-gap evaluate --input qc-example/review_input.csv --config qc-example/review.yaml --output qc-example/results
