[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "qc-transfer-gap"
version = "0.1.0"
description = "Evaluate segmentation QC review policies against derived RV ejection-fraction errors"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Emmanouil Gionanidis" }]
dependencies = ["numpy==2.4.6", "pandas==3.0.3", "PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
qc-transfer-gap = "cardiac_functional_qc.cli:main"

[project.urls]
Repository = "https://github.com/gionanide/qc-transfer-gap"

[tool.hatch.build.targets.wheel]
packages = ["src/cardiac_functional_qc"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "configs", "docs", "README.md", "LICENSE", "CITATION.cff", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
